// Downhill Revived's APK (finding 091). The native libraries are prebuilt by
// port/tools/build_host64.py --target android-arm64 and copied into src/main/jniLibs by port/android/build_apk.py,
// which also adds SDL's Java sources (org.libsdl.app) and the icons; Gradle only packages and signs.
plugins {
    id 'com.android.application'
}

android {
    namespace = "app.downhillrevived"
    compileSdk = 35
    defaultConfig {
        applicationId = "app.downhillrevived"
        // armeabi-v7a: API 26 keeps older 32-bit MediaTek handsets installable; arm64 stays at 30
        // (memfd_create, finding 091). The ABI comes from build_apk.py (-PdhdAbi).
        def dhdAbi = project.hasProperty('dhdAbi') ? project.dhdAbi : 'arm64-v8a'
        minSdk = dhdAbi == 'armeabi-v7a' ? 26 : 30
        targetSdk = 35
        versionCode = project.hasProperty('dhdVersionCode') ? project.dhdVersionCode.toInteger() : 1
        versionName = project.hasProperty('dhdVersionName') ? project.dhdVersionName : "0.0"
        ndk {
            abiFilters dhdAbi
        }
        manifestPlaceholders = [
            // Vulkan 1.1 required on arm64; optional on armv7 (the renderer there falls back to
            // OpenGL ES 3.0 with DHD_WGPU_BACKEND=gl)
            dhdVulkanRequired: dhdAbi == 'armeabi-v7a' ? 'false' : 'true',
            dhdGlEsRequired  : dhdAbi == 'armeabi-v7a' ? 'true' : 'false'
        ]
    }
    compileOptions {   // SDL's Java needs 8; 17 is what AGP 8.7 targets without warnings
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    signingConfigs {
        // CI passes these from the DHD_KEYSTORE_* secrets (build_apk.py --release). Without
        // them the release build is unsigned and build_apk.py says so.
        release {
            if (project.hasProperty('dhdKeystore')) {
                storeFile = file(project.property('dhdKeystore'))
                storePassword = project.property('dhdKeystorePassword')
                keyAlias = project.property('dhdKeyAlias')
                keyPassword = project.property('dhdKeyPassword')
            }
        }
    }
    buildTypes {
        debug {
            debuggable = true
            jniDebuggable = true
        }
        release {
            minifyEnabled = false
            signingConfig = project.hasProperty('dhdKeystore') ? signingConfigs.release : null
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false   // stored uncompressed and page-aligned: loaded from the APK
            keepDebugSymbols += ['**/*.so']  // already stripped (build_host64.py keeps libmain.debug.so)
        }
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

name: android

on:
  push:
  workflow_dispatch:
    inputs:
      experimental_split:
        description: 'Experimental split memory (NOT a verified release)'
        type: boolean
        default: false
  repository_dispatch:

env:
  DHD_EXPERIMENTAL_SPLIT_MEMORY: ${{ inputs.experimental_split == true && '1' || '0' }}

jobs:
  fixture:
    name: armv7 fixture (no game dump)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_NET_OFFLINE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: NDK
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME/tools"
          echo "ANDROID_NDK_HOME=$HOME/tools/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Rust (armv7 target)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          chmod +x /tmp/rustup-init && /tmp/rustup-init -y --default-toolchain 1.97.1 --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add armv7-linux-androideabi
      - name: wasi-sdk, wabt, simde
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wasi.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi.tar.gz -C "$HOME/tools"
          echo "WASI_SDK=$HOME/tools/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
          echo "WASI_SYSROOT=$HOME/tools/wasi-sdk-34.0-x86_64-linux/share/wasi-sysroot" >> "$GITHUB_ENV"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wabt.tar.gz https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz
          tar xzf /tmp/wabt.tar.gz -C "$HOME/tools"
          mkdir -p "$HOME/DevCaches/wabt" && ln -sfn "$HOME/tools/wabt-1.0.42" "$HOME/DevCaches/wabt/wabt-1.0.42"
          git clone -q https://github.com/simd-everywhere/simde.git "$HOME/simde"
          cd "$HOME/simde" && git checkout -q 65c15e6
          ln -sfn "$HOME/simde" "$HOME/DevCaches/simde-src"
          echo "DHD_DEVCACHES=$HOME/DevCaches" >> "$GITHUB_ENV"
      - name: JNI export-map regression before full build
        run: python3 port/tools/test_android_jni_exports.py
      - name: Touch controls and multitouch regression
        run: |
          mkdir -p /tmp/dhd-touch-test
          javac -d /tmp/dhd-touch-test \
            port/android/app/src/main/java/app/downhillrevived/TouchPadModel.java \
            port/android/app/src/test/java/app/downhillrevived/TouchPadModelTest.java
          java -cp /tmp/dhd-touch-test app.downhillrevived.TouchPadModelTest
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Iport/runtime -Iport/include \
            port/host/android_touch.c port/host/test_android_touch.c -o /tmp/test-touch
          /tmp/test-touch
      - name: GS packed vertex regression
        run: |
          cc -std=gnu11 -O2 -no-pie -Iport/runtime -Iport/include -Iport/hle \
            port/gs/memory.c port/gs/gs.c port/gs/display.c port/gs/test_gs.c port/host64/test_low.c \
            -lm -o /tmp/test-gs
          /tmp/test-gs
      - name: Audio stretch search regression
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/sdl3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
          tar xzf /tmp/sdl3.tar.gz -C /tmp
          cc -std=gnu11 -O2 -ffunction-sections -fdata-sections -I/tmp/SDL3-3.4.18/include -Iport/include -Iport/hle -Iport/runtime \
            port/host/test_sound_android_callback.c -Wl,--gc-sections -lm -o /tmp/test-sound-callback
          /tmp/test-sound-callback
          cc -std=c11 -O2 -Wall -Wextra -Werror port/host/test_sound_wsola.c -lm -o /tmp/test-sound-wsola
          /tmp/test-sound-wsola
          cc -std=c11 -O2 -Wall -Wextra -Werror port/host/test_sound_ring_copy.c -o /tmp/test-sound-ring
          /tmp/test-sound-ring
          cc -std=c11 -O2 -Wall -Wextra -Werror port/host/test_sound_live_options.c -o /tmp/test-sound-live
          /tmp/test-sound-live
      - name: Android log size cap regression
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror port/hle/test_android_log_limit.c -o /tmp/test-android-log-limit
          /tmp/test-android-log-limit
      - name: Signal-safe crash record regression (Linux host)
        run: |
          cc -std=gnu11 -O2 -g -Wall -Wextra -Werror -Wl,--build-id=sha1 \
            port/hle/test_android_crash_log.c -ldl -o /tmp/test-android-crash-log
          ulimit -c 0
          /tmp/test-android-crash-log
      - name: Guest reservation ownership regression
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror \
            -I "$HOME/tools/wabt-1.0.42/include" -I port/host64 \
            port/host64/guest_memory.c port/host64/test_reservation.c -o /tmp/test-guest-reservation
          /tmp/test-guest-reservation
      - name: Split reservation planner tests (experimental opt-in)
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            port/host64/split_reservation.c port/host64/test_split_reservation.c -o /tmp/test-split
          /tmp/test-split
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang" \
            -std=gnu11 -Wall -Wextra -Werror -c port/host64/split_reservation.c -o /tmp/split-armv7.o
      - name: ARM 32-bit allocator tests under QEMU (Linux, not Android)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf qemu-user
          common="-std=gnu11 -O2 -static -march=armv7-a -mfpu=vfpv3-d16 -Wall -Wextra -Werror"
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -no-pie -Iport/runtime -Iport/include -Iport/hle \
            port/gs/memory.c port/gs/gs.c port/gs/display.c port/gs/test_gs.c port/host64/test_low.c \
            -lm -o /tmp/test-gs-armv7
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/test-gs-armv7
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -mfpu=neon -mfloat-abi=hard \
            port/runtime/test_vu_neon_operand.c -o /tmp/test-vu-neon-operand
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/test-vu-neon-operand
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -Iport/runtime -Iport/include \
            port/host/android_touch.c port/host/test_android_touch.c -o /tmp/test-touch-armv7
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/test-touch-armv7
          arm-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror port/host/test_sound_wsola.c -lm -o /tmp/test-sound-wsola-armv7
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/test-sound-wsola-armv7
          arm-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror port/host/test_sound_ring_copy.c -o /tmp/test-sound-ring-armv7
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/test-sound-ring-armv7
          arm-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror port/host/test_sound_live_options.c -o /tmp/test-sound-live-armv7
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/test-sound-live-armv7
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -ffunction-sections -fdata-sections -I/tmp/SDL3-3.4.18/include -Iport/include -Iport/hle -Iport/runtime \
            port/host/test_sound_android_callback.c -Wl,--gc-sections -lm -o /tmp/test-sound-callback-armv7
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/test-sound-callback-armv7
          # Exercise the real ARM mcontext registers and re-raised synchronous SIGSEGV.
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -g -Wall -Wextra -Werror -Wl,--build-id=sha1 \
            port/hle/test_android_crash_log.c -ldl -o /tmp/test-crash-armv7
          ulimit -c 0
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/test-crash-armv7
          arm-linux-gnueabihf-gcc $common -I "$HOME/tools/wabt-1.0.42/include" -I port/host64 \
            port/host64/guest_memory.c port/host64/test_reservation.c -o /tmp/test-reservation-armv7
          qemu-arm /tmp/test-reservation-armv7
          arm-linux-gnueabihf-gcc $common -I "$HOME/tools/wabt-1.0.42/include" -I port/host64 \
            port/host64/guest_memory.c port/host64/guest_memory_posix.c port/host64/test_guest_real.c -o /tmp/test-real-armv7
          qemu-arm /tmp/test-real-armv7
          arm-linux-gnueabihf-gcc $common \
            port/host64/split_reservation.c port/host64/test_split_reservation.c -o /tmp/test-split-armv7
          qemu-arm /tmp/test-split-armv7
          arm-linux-gnueabihf-gcc $common -I "$HOME/tools/wabt-1.0.42/include" -I port/host64 \
            port/host64/test_split_access.c -o /tmp/test-split-access-armv7
          qemu-arm /tmp/test-split-access-armv7
          python3 port/tools/test_split_module.py --wabt "$HOME/tools/wabt-1.0.42" --simde "$HOME/simde" --clang --negative-control
          python3 port/tools/test_split_module.py --wabt "$HOME/tools/wabt-1.0.42" --simde "$HOME/simde" --arm --negative-control
          python3 port/tools/test_split_module.py --wabt "$HOME/tools/wabt-1.0.42" --simde "$HOME/simde" --arm --clang --negative-control
          python3 port/tools/test_fiber_arm.py --wabt "$HOME/tools/wabt-1.0.42" --negative-control
          ndkcc="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
          for source in guest_memory.c guest_memory_posix.c bridge.c test_split_access.c fiber_arm32.c fp_mode.c; do
            "$ndkcc" -std=gnu11 -DDHD_EXPERIMENTAL_SPLIT_MEMORY -D_FILE_OFFSET_BITS=64 \
              -I "$HOME/tools/wabt-1.0.42/include" -I port/host64 \
              -c "port/host64/$source" -o "/tmp/$source.armv7.o"
          done
          "$ndkcc" -std=gnu11 -DDHD_EXPERIMENTAL_SPLIT_MEMORY -D_FILE_OFFSET_BITS=64 \
            -I "$HOME/tools/wabt-1.0.42/include" -I port/host64 \
            -c port/host/host_posix.c -o /tmp/host_posix.armv7.o
      - name: cmake, ninja
        run: pip install --user cmake ninja && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prime cargo registry (rustgs builds --locked --offline)
        run: cd port/render && cargo fetch --locked
      - name: Settings corpus regression
        run: cd port/render && cargo test --locked --offline -p dhd_settings --test corpus
      - name: Verify Android ARMv7 GL backend is compiled
        run: python3 port/tools/test_renderer_features.py
      - name: Mesa GLES pipeline and depth readback smoke test (Linux, not Android)
        run: |
          sudo apt-get install -y -qq libegl1 libgles2 libgl1-mesa-dri
          cd port/render
          LIBGL_ALWAYS_SOFTWARE=1 DHD_TEST_FORCE_GLES=1 cargo test --locked --offline \
            --features native,gles-smoke --test gl_smoke --test glsl_raster_regression -- --nocapture
      - name: Fixture link (armeabi-v7a)
        run: python3 port/tools/build_host64.py --target android-armv7 --fake --wasi "$WASI_SDK" --jobs 4
      - name: Fiber selftest binary
        run: python3 port/tools/build_host64.py --target android-armv7 --fiber-test

  apk:
    name: armeabi-v7a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: fixture
    env:
      CARGO_NET_OFFLINE: 'false'
      DHD_ELF_URL: ${{ secrets.DHD_ELF_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$HOME/gradle-home" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$HOME/gradle-home/au" >> "$GITHUB_ENV"
      - name: NDK
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME/tools"
          echo "ANDROID_NDK_HOME=$HOME/tools/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Rust (armv7 target)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          chmod +x /tmp/rustup-init && /tmp/rustup-init -y --default-toolchain 1.97.1 --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add armv7-linux-androideabi
      - name: wasi-sdk, wabt, simde
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wasi.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi.tar.gz -C "$HOME/tools"
          echo "WASI_SDK=$HOME/tools/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
          echo "WASI_SYSROOT=$HOME/tools/wasi-sdk-34.0-x86_64-linux/share/wasi-sysroot" >> "$GITHUB_ENV"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wabt.tar.gz https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz
          tar xzf /tmp/wabt.tar.gz -C "$HOME/tools"
          mkdir -p "$HOME/DevCaches/wabt" && ln -sfn "$HOME/tools/wabt-1.0.42" "$HOME/DevCaches/wabt/wabt-1.0.42"
          git clone -q https://github.com/simd-everywhere/simde.git "$HOME/simde"
          cd "$HOME/simde" && git checkout -q 65c15e6
          ln -sfn "$HOME/simde" "$HOME/DevCaches/simde-src"
          echo "DHD_DEVCACHES=$HOME/DevCaches" >> "$GITHUB_ENV"
      - name: cmake, ninja
        run: pip install --user cmake ninja && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prime cargo registry (rustgs builds --locked --offline)
        run: cd port/render && cargo fetch --locked
      - name: Player dump — SCUS_971.77 from DHD_ELF_URL (BYOD)
        if: env.DHD_ELF_URL != ''
        run: |
          python3 -m pip install --user -q pycdlib
          mkdir -p iso
          python3 port/tools/fetch_dump.py "$DHD_ELF_URL" iso/SCUS_971.77
      - name: "Split (splat: asm/ and assets/ from the dump)"
        if: env.DHD_ELF_URL != ''
        run: |
          python3 -m pip install --user -q -r requirements.txt
          python3 tools/split.py
      - name: Core and host (build.py --target android-armv7)
        if: env.DHD_ELF_URL != ''
        run: |
          # The project builds with LLVM 23 (docs/BUILDING.md): wasm-ld's --no-stack-first
          # only exists from LLD 22 (llvm-project #166384); the runner's lld-18 rejects it.
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23 clang lld llvm
          export PATH="/usr/lib/llvm-23/bin:$WASI_SDK/bin:$PATH"
          clang --version | head -1
          wasm-ld --version | head -1
          python3 port/tools/build.py --target android-armv7 -- --debug
      - name: Fixture libraries (no dump secret)
        if: env.DHD_ELF_URL == ''
        run: |
          echo "DHD_ELF_URL secret unset: fixture link (no game module) only"
          python3 port/tools/build_host64.py --target android-armv7 --fake --wasi "$WASI_SDK" --jobs 4
      - name: Release keystore
        env:
          DHD_KEYSTORE_B64: ${{ secrets.DHD_KEYSTORE_B64 }}
        run: |
          if [ -n "$DHD_KEYSTORE_B64" ]; then
            printf '%s' "$DHD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/downhill-revived.p12"
            echo "DHD_KEYSTORE=$RUNNER_TEMP/downhill-revived.p12" >> "$GITHUB_ENV"
          else
            echo "DHD_KEYSTORE_B64 secret unset: the APK will be unsigned"
          fi
      - name: APK (armeabi-v7a, release-signed)
        env:
          DHD_KEYSTORE_PASSWORD: ${{ secrets.DHD_KEYSTORE_PASSWORD }}
          DHD_KEY_ALIAS: ${{ secrets.DHD_KEY_ALIAS }}
          DHD_KEY_PASSWORD: ${{ secrets.DHD_KEY_PASSWORD }}
        run: python3 port/android/build_apk.py --abi armeabi-v7a --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.experimental_split == true && 'downhill-revived-armeabi-v7a-experimental-unverified' || 'downhill-revived-armeabi-v7a-release' }}
          path: build/android/*armeabi-v7a*.apk
          if-no-files-found: error

      - name: Verify touch JNI exports
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$nm" -D --defined-only build/android/lib/armeabi-v7a/libmain.so | grep 'Java_app_downhillrevived_DhdActivity_nativeTouchState'
          "$nm" -D --defined-only build/android/lib/armeabi-v7a/libmain.so | grep 'Java_app_downhillrevived_DhdActivity_nativeSaveOption'
          "$nm" -D --defined-only build/android/lib/armeabi-v7a/libmain.so | grep 'Java_app_downhillrevived_DhdActivity_nativeSettingsLoaded'
          "$nm" -D --defined-only build/android/lib/armeabi-v7a/libmain.so | grep 'Java_app_downhillrevived_DhdActivity_nativeReadOption'
      - name: Verify matching Android ELF build IDs
        if: env.DHD_ELF_URL != ''
        run: |
          tool="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          a=$("$tool" -n build/android/libmain.debug.so | grep 'Build ID:' | awk '{print $3}')
          b=$("$tool" -n build/android/lib/armeabi-v7a/libmain.so | grep 'Build ID:' | awk '{print $3}')
          test -n "$a" && test "$a" = "$b"
          echo "matching Android ELF Build ID: $a"
      - name: Upload matching unstripped native symbols (CI artifact)
        if: env.DHD_ELF_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-armv7-native-symbols-${{ github.sha }}
          path: build/android/libmain.debug.so
          if-no-files-found: error
          retention-days: 30

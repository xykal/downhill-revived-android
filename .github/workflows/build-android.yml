name: android

on:
  push:
  workflow_dispatch:
  repository_dispatch:

jobs:
  fixture:
    name: armv7 fixture (no game dump)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_NET_OFFLINE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: NDK
        run: |
          curl -sSL --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME/tools"
          echo "ANDROID_NDK_HOME=$HOME/tools/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Rust (armv7 target)
        run: |
          curl -sSL --retry 3 -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          chmod +x /tmp/rustup-init && /tmp/rustup-init -y --default-toolchain 1.97.1 --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add armv7-linux-androideabi
      - name: wasi-sdk, wabt, simde
        run: |
          curl -sSL --retry 3 -o /tmp/wasi.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi.tar.gz -C "$HOME/tools"
          echo "WASI_SDK=$HOME/tools/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
          curl -sSL --retry 3 -o /tmp/wabt.tar.gz https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-ubuntu.tar.gz
          tar xzf /tmp/wabt.tar.gz -C "$HOME/tools"
          mkdir -p "$HOME/DevCaches/wabt" && ln -sfn "$HOME/tools/wabt-1.0.42" "$HOME/DevCaches/wabt/wabt-1.0.42"
          git clone -q https://github.com/simd-everywhere/simde.git "$HOME/simde"
          cd "$HOME/simde" && git checkout -q 65c15e6
          ln -sfn "$HOME/simde" "$HOME/DevCaches/simde-src"
          echo "DHD_DEVCACHES=$HOME/DevCaches" >> "$GITHUB_ENV"
      - name: cmake, ninja
        run: pip install --user cmake ninja && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fixture link (armeabi-v7a)
        run: python3 port/tools/build_host64.py --target android-armv7 --fake --wasi "$WASI_SDK" --jobs 4
      - name: Fiber selftest binary
        run: python3 port/tools/build_host64.py --target android-armv7 --fiber-test

  apk:
    name: armeabi-v7a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: fixture
    env:
      CARGO_NET_OFFLINE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sSL --retry 3 -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$HOME/gradle-home" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$HOME/gradle-home/au" >> "$GITHUB_ENV"
      - name: NDK
        run: |
          curl -sSL --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME/tools"
          echo "ANDROID_NDK_HOME=$HOME/tools/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Rust (armv7 target)
        run: |
          curl -sSL --retry 3 -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          chmod +x /tmp/rustup-init && /tmp/rustup-init -y --default-toolchain 1.97.1 --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add armv7-linux-androideabi
      - name: wasi-sdk, wabt, simde
        run: |
          curl -sSL --retry 3 -o /tmp/wasi.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi.tar.gz -C "$HOME/tools"
          echo "WASI_SDK=$HOME/tools/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
          curl -sSL --retry 3 -o /tmp/wabt.tar.gz https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-ubuntu.tar.gz
          tar xzf /tmp/wabt.tar.gz -C "$HOME/tools"
          mkdir -p "$HOME/DevCaches/wabt" && ln -sfn "$HOME/tools/wabt-1.0.42" "$HOME/DevCaches/wabt/wabt-1.0.42"
          git clone -q https://github.com/simd-everywhere/simde.git "$HOME/simde"
          cd "$HOME/simde" && git checkout -q 65c15e6
          ln -sfn "$HOME/simde" "$HOME/DevCaches/simde-src"
          echo "DHD_DEVCACHES=$HOME/DevCaches" >> "$GITHUB_ENV"
      - name: cmake, ninja
        run: pip install --user cmake ninja && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Game ELF (your own dump; BYOD)
        if: ${{ secrets.DHD_ELF_URL != '' }}
        env:
          DHD_ELF_URL: ${{ secrets.DHD_ELF_URL }}
        run: |
          curl -sSL --retry 3 -o /tmp/scus.elf "$DHD_ELF_URL"
          echo "DHD_VUTEXT=/tmp/scus.elf" >> "$GITHUB_ENV"
      - name: Build libraries + APK (armeabi-v7a)
        run: |
          if [ -n "$DHD_VUTEXT" ]; then
            python3 port/tools/build_host64.py --target android-armv7 --wasi "$WASI_SDK" --jobs 4
          else
            echo "DHD_ELF_URL secret unset: fixture link (no game module) only"
            python3 port/tools/build_host64.py --target android-armv7 --fake --wasi "$WASI_SDK" --jobs 4
          fi
          python3 port/android/build_apk.py --abi armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: downhill-revived-armeabi-v7a-debug
          path: build/android/*armeabi-v7a*.apk
          if-no-files-found: error
